const formatDate=t=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(t);
function remaining(t){const s=Math.max(0,Math.ceil((t-now())/1000));return `${Math.floor(s/3600)}時間 ${String(Math.floor(s/60)%60).padStart(2,'0')}分 ${String(s%60).padStart(2,'0')}秒`;}
function nextCard(){const a=nextAction(now());return `<section class="next-action" id="next-action"><span class="eyebrow">▶ NEXT ACTION</span><h2>${a?`${a.time} ${esc(actionText(a,state.role,now()))}`:'次の行動はありません'}</h2><p>${a?`DAY ${a.day} / ${formatDate(Date.parse(a.at))} · 要確認`:'ふたりの冒険を、しおりで振り返ろう。'}</p>${a?`<div class="timer">出発まであと <b id="countdown">${remaining(Date.parse(a.at))}</b></div>`:''}<button class="primary" data-today="${a?.day||tripDay(now())}">今日のスケジュールを見る →</button></section>`;}
function home(){return `<section class="hero"><span class="eyebrow">THE NEXT CHAPTER OF OUR STORY</span><h1>結婚式お疲れ様旅行</h1><p class="subtitle">クリア後のごほうびクエスト</p><div class="datepill">2026.10.31 — 11.02 / ${state.role==='bride'?'新婦':'新郎'}</div>${landscape()}<div class="message"><span class="message-label">♥ ふたりの冒険、ふたたび。</span><p>メインクエスト、おつかれさま！<br>食べて、休んで、幸せをレベルアップ。</p><span class="triangle">▼</span></div></section>${nextCard()}<div class="sectionhead"><h2>PARTY STATUS</h2><button data-page="status" class="textbtn">くわしく →</button></div>${players()}<div class="sectionhead"><h2>冒険のあしあと</h2><span class="badge">${Object.keys(state.questClears).length} / ${quests.length} CLEAR</span></div><button class="secondary" data-page="quest">⚑ 3日間の冒険のしおり</button><p class="footnote">架空予定のデモ / ${formatDate(now())} / JST</p>`;}
function quest(){return `<div class="pageheading"><span class="eyebrow">ADVENTURE ITINERARY</span><h1>冒険のしおり</h1><p>時刻をたどって、ふたりの旅へ。</p></div><div class="tabs">${[1,2,3].map(d=>`<button data-day="${d}" aria-pressed="${selectedDay===d}">DAY ${d}<small>${['10/31','11/1','11/2'][d-1]}</small></button>`).join('')}</div><h2>${themes[selectedDay-1]}</h2><p class="notice">架空の予定です。時刻は仮予定・要確認。<br>${state.role==='bride'?'新婦：すべての詳細を表示中（デモ）':'新郎：未訪問の場所名を伏せています。移動時刻は先に確認できます。'}</p>${quests.filter(q=>q.day===selectedDay).map(q=>{const st=questState(state,q,now()),known=state.role==='bride'||st!=='locked';return `<article class="quest-block ${st}"><header><span class="eyebrow">QUEST ${String(quests.filter(x=>x.day===q.day).indexOf(q)+1).padStart(2,'0')}</span><span class="badge">${st==='clear'?'✓ QUEST CLEAR!':st==='open'?'解放済み':'▣ 未解放'}</span></header><h2>${known?q.title:'ひみつのクエスト'}</h2>${state.role==='bride'?`<p class="notice">情報解放 ${q.revealAt.slice(11,16)} / 日本時間</p>`:''}<ol class="schedule">${q.actionIds.map(id=>actions.find(a=>a.id===id)).map(a=>`<li class="${Date.parse(a.at)<=now()?'past':''}"><time>${a.time}</time><div><strong>${esc(actionText(a,state.role,now()))}</strong><small>${a.note}</small></div></li>`).join('')}</ol>${!q.actionIds.length?'<p>長い冒険を終えたふたりへ。おつかれさま！</p>':''}${st==='clear'?`<p class="clear-record">✓ 達成記録：${formatDate(Date.parse(state.questClears[q.id]))}</p>`:st==='open'?`<button class="primary" data-clear="${q.id}">${q.final?'冒険の達成を記録！':'到着した！ / 達成した！'}</button>`:'<p class="notice">訪問予定時刻のあとに詳細が解放されます。<br>解放と達成は別々です。達成はボタンで記録します。</p>'}</article>`;}).join('')}`;}
function eligibleDates(){return statusPrompts.filter(p=>Date.parse(p.at)<=now()).map(p=>p.date);}
function status(){const available=recoveryEvents.filter(e=>Date.parse(e.availableAt)<=now());const eligible=eligibleDates();return `<div class="pageheading"><span class="eyebrow">PARTY & RECOVERY</span><h1>ふたりのステータス</h1><p>休むたびに、冒険の器が大きくなる。</p></div>${players()}<h2>回復イベント</h2><p class="notice">時刻になるとイベントが届きます。「あとで」のイベントもここから達成できます。</p><div class="events">${available.map(e=>{const effect=effects.find(f=>f.id===e.effect),done=state.done.includes(e.id);return `<button data-event="${e.id}" ${done?'disabled':''}><span class="eventicon">${effect.icon}</span><span><small>DAY ${e.day} / ${e.availableAt.slice(11,16)}</small><strong>${effect.name}</strong><small>${effectDescription(effect)}</small></span><b>${done?'✓':'＋'}</b></button>`;}).join('')||'<div class="panel">まだ回復イベントはありません。旅の時間をお楽しみに。</div>'}</div><div class="panel"><span class="eyebrow">TODAY’S STATUS</span><h2>今日の冒険はどうだった？</h2><p>DAY1・2は21時から入力できます。最終日は15時から、帰宅後や後日も記録できます。</p>${eligible.length?`<label>記録する日<select id="record-date">${eligible.map(date=>`<option ${date===(recordDate||eligible.at(-1))?'selected':''}>${date}</option>`).join('')}</select></label><button class="primary" id="open-record">${state.role==='groom'?'新郎':'新婦'}のステータスを記録</button>`:'<p class="notice">夜になったら、入力をご案内します。</p>'}</div><h2>保存した夜の記録</h2>${Object.entries(state.logs).map(([key,v])=>`<div class="log-entry"><b>${esc(key.replace(':groom',' 新郎').replace(':bride',' 新婦'))}</b><p>${Object.entries(v).map(([k,n])=>`${labels[k]} ${n}`).join(' / ')}</p></div>`).join('')||'<p class="notice">まだ記録はありません。</p>'}`;}
const effectDescription=e=>[...Object.entries(e.max).map(([k,v])=>`最大${labels[k]} +${v}`),...Object.entries(e.current).map(([k,v])=>`${labels[k]} ${v>0?'+':''}${v}`)].join(' / ');
function item(){return `<div class="pageheading"><span class="eyebrow">ADVENTURE BAG</span><h1>旅のどうぐ</h1><p>忘れものをチェックして出発！</p></div><div class="panel green"><h2>防寒そうびを忘れずに</h2><p>標高の高い場所は秋の終わりに冷え込みます。重ね着・防寒小物・歩きやすい靴を準備しよう。</p></div><div class="sectionhead"><h2>持ち物</h2><span class="badge">${state.items.length} / ${items.length}</span></div><div class="checklist">${items.map((s,i)=>`<label><input type="checkbox" data-item="${i}" ${state.items.includes(i)?'checked':''}><span>${s}</span></label>`).join('')}</div><div class="panel"><h2>冒険の心得</h2><p>体調をいちばん大切に。<br>水分補給とこまめな休憩。<br>無理せず、ふたりのペースで。</p></div>`;}
function settings(){return `<div class="pageheading"><span class="eyebrow">SYSTEM MENU</span><h1>冒険の設定</h1></div><div class="panel"><h2>プレイヤー（架空デモ）</h2><p>認証機能ではありません。実際の旅行先は収録していません。</p><div class="tabs">${['groom','bride'].map(r=>`<button data-role="${r}" aria-pressed="${state.role===r}">${r==='groom'?'新郎':'新婦'}</button>`).join('')}</div></div><div class="panel"><h2>演出</h2><label class="toggle"><input id="motion" type="checkbox" ${state.motion?'checked':''}>アニメーションを使う</label><button id="replay" class="secondary">15秒のオープニングを再視聴</button></div><div class="panel"><h2>保存状態</h2><p>${esc(storageError||'この端末に保存中')}<br>クラウド共有・ログインは未接続です。</p><button id="export" class="secondary">バックアップをダウンロード</button></div><div class="panel"><h2>デモ日時（日本時間）</h2><p>変更した時刻から秒針が進みます。巻き戻しても達成と確認済み通知は保持されます。</p><input id="clock" type="datetime-local" value="${new Date(now()+32400000).toISOString().slice(0,16)}"><button id="setclock" class="primary">この時刻で冒険する</button><button id="realclock" class="secondary">現在の時刻に戻す</button></div>`;}
function render(){document.body.classList.toggle('reduced',reduced());app.innerHTML=`<div class="shell"><header class="topbar"><a href="#home" data-page="home" class="brand">♥ <span>REWARD QUEST</span></a><span class="topright">${preview===null?'LOCAL DEMO':'DEMO TIME'} <i>●</i></span></header>${storageError?`<div role="alert" class="error">${esc(storageError)}</div>`:''}<main id="main">${({home,quest,status,item,settings})[page]()}</main><nav aria-label="メインメニュー">${[['home','⌂','HOME'],['quest','⚑','QUEST'],['status','♡','STATUS'],['item','▣','ITEM'],['settings','⚙','SYSTEM']].map(([id,icon,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}><span>${navIcon(id)}</span><small>${name}</small></button>`).join('')}</nav></div>`;if(opening)drawOpening();else if(activeNotice)drawNotice();}
function showModal(content,label){const d=document.createElement('dialog');d.className='game-dialog';d.setAttribute('aria-label',label);d.innerHTML=content;d.addEventListener('cancel',e=>{e.preventDefault();if(activeNotice?.notification)ackNotice();else closeModal();});app.append(d);d.showModal();return d;}
function drawNotice(){const n=activeNotice;if(n.type==='record'){const date=n.ref,role=state.role,saved=state.logs[`${date}:${role}`];showModal(`<form id="daily"><span class="eyebrow">TODAY’S STATUS / ${date}</span><h2>今日の冒険はどうだった？</h2><p>${role==='groom'?'新郎':'新婦'}の現在値を入力</p>${Object.entries(state.players[role]).map(([k,v])=>`<label class="sliderlabel">${labels[k]} <output id="out-${k}">${saved?.[k]??v[0]}</output><input name="${k}" type="range" min="0" max="${v[1]}" value="${saved?.[k]??v[0]}"></label>`).join('')}<p class="notice">保存すると現在のステータスにも反映します。</p><button class="primary" type="submit">記録を保存する</button><button class="secondary" type="button" data-dismiss>あとで</button></form>`,'ステータス入力');return;}let buttons='';if(n.type==='event')buttons=`<button class="primary" data-event="${n.ref}">達成した！</button>`;if(n.type==='status')buttons=`<button class="primary" id="notice-record">入力する</button>`;if(n.type==='quest'||n.type==='final')buttons=`<button class="primary" id="notice-quest">しおりを見る</button>`;showModal(`<div class="popup-art">${n.type==='level'?'✦':n.type==='final'?'★':'⚑'}</div><span class="eyebrow">${esc(n.title)}</span><h2>${esc(n.text)}</h2>${n.type==='event'?`<p class="notice">${effectDescription(effects.find(f=>f.id===recoveryEvents.find(e=>e.id===n.ref).effect))}</p>`:''}${n.type==='final'?'<p>おつかれさま！達成はしおりのボタンで記録しよう。最終日のステータスも保存できます。</p>':''}${buttons}<button class="secondary" data-dismiss>${n.type==='event'||n.type==='status'?'あとで':'とじる'}</button><small class="notice">${n.notification?`未確認のお知らせ ${notifications(state,now()).length}件 / 確認後は再表示しません`:''}</small>`,n.title);}
function closeModal(){activeNotice=null;render();}
async function ackNotice(){const n=activeNotice;if(!n)return;activeNotice=null;if(n.notification)await update(s=>({...s,ack:[...new Set([...s.ack,`${s.role}:${n.id}`])]}));else render();}
function promptPending(){if(opening||activeNotice||page==='settings'||storageError||document.hidden)return;const pending=notifications(state,now());if(pending.length){activeNotice={...pending[0],notification:true};render();}}
function finishOpening(){timers.forEach(clearTimeout);timers=[];opening=false;scene=0;update(s=>({...s,seen:true})).then(promptPending);}
function startOpening(){timers.forEach(clearTimeout);activeNotice=null;opening=true;scene=0;render();if(reduced())return;for(const [ms,s] of [[5000,1],[9000,2],[15000,3]])timers.push(setTimeout(()=>{scene=s;render();},ms));}
function drawOpening(){const overlay=document.createElement('div');overlay.className=`opening scene${scene}`;overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','冒険のプロローグ');overlay.setAttribute('aria-modal','true');overlay.innerHTML=`<button id="skip" class="skip">スキップ →</button><div class="introcontent"><span class="eyebrow">${scene===0?'2026.10.10 · WEDDING DAY':scene===1?'AFTER THE MAIN QUEST':'A NEW CHAPTER'}</span><div class="introart">${scene===0?'<div class="chapel">♧<br>▦ ▦<br>▥</div>':scene===1?'<div class="bed">▰</div>':'<div class="quest-notify">✦ NEW QUEST UNLOCKED! ✦</div>'}${pair()}${scene===0?Array.from({length:24},(_,i)=>`<i class="petal" style="--x:${i*4.2}%;--delay:${i%7*.4}s"></i>`).join(''):''}</div><h1>${scene===0?'MAIN QUEST CLEAR!':scene===1?'おうちへ帰還……':'結婚式お疲れ様旅行'}</h1><p>${scene===0?'結婚式を成功させた！<br>わーい！ わーい！':scene===1?'長い冒険を終えた2人は、<br>すっかり疲れ果ててしまった……':'クリア後のごほうびクエスト'}</p>${scene===1?'<div class="intro-gauge">HP <i></i></div><div class="intro-gauge">MP <i></i></div>':''}${scene>=3?'<button class="primary" id="begin">冒険をはじめる！</button>':''}${reduced()&&scene<3?'<button id="nextscene" class="secondary">次へ</button>':''}<div class="scene-dots">${[0,1,2].map(n=>`<i class="${Math.min(scene,2)===n?'active':''}"></i>`).join('')}</div></div>`;app.append(overlay);app.querySelector('.shell').inert=true;overlay.querySelector('button').focus();}
async function completeEvent(id){const e=recoveryEvents.find(e=>e.id===id);if(completing||!e||state.done.includes(id)||Date.parse(e.availableAt)>now())return;completing=true;let applied=false;const pending=activeNotice;activeNotice=null;const success=await update(s=>{let n=applyEvent(s,id,now());if(n===s)return s;applied=true;if(pending?.notification)n.ack.push(`${s.role}:${pending.id}`);return n;});completing=false;if(success&&applied){const effect=effects.find(f=>f.id===e.effect);activeNotice={type:'level',title:'EVENT CLEAR! / LEVEL UP!',text:`2人の${Object.entries(effect.max).map(([k,v])=>`最大${labels[k]}が${v}アップ！`).join(' ')}`};render();}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;
if(b.dataset.page){e.preventDefault();page=b.dataset.page;render();window.scrollTo(0,0);}if(b.dataset.today){selectedDay=+b.dataset.today;page='quest';render();window.scrollTo(0,0);}if(b.dataset.day){selectedDay=+b.dataset.day;render();}
if(b.dataset.clear){const id=b.dataset.clear;if(await update(s=>clearQuest(s,id,now())))toast('✓ QUEST CLEAR! 達成記録を保存した！');}
if(b.dataset.event)await completeEvent(b.dataset.event);
if(b.dataset.role)await update(s=>({...s,role:b.dataset.role}));
if(b.id==='replay')startOpening();if(['skip','begin'].includes(b.id))finishOpening();if(b.id==='nextscene'){scene++;render();}
if(b.hasAttribute('data-dismiss')){await ackNotice();}
if(b.id==='notice-quest'){const q=quests.find(q=>q.id===activeNotice.ref);page='quest';selectedDay=q.day;await ackNotice();}
if(b.id==='notice-record'){const date=activeNotice.ref;await ackNotice();activeNotice={type:'record',ref:date};render();}
if(b.id==='open-record'){const date=document.querySelector('#record-date').value;activeNotice={type:'record',ref:date};render();}
if(b.id==='setclock'){const value=document.querySelector('#clock').value;const t=Date.parse(value+':00+09:00');if(Number.isFinite(t)){preview=t;previewStarted=Date.now();render();toast('デモ時刻を変更しました');}}
if(b.id==='realclock'){preview=null;render();}
if(b.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='reward-quest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
document.addEventListener('change',e=>{if(e.target.dataset.item!==undefined){const id=+e.target.dataset.item,checked=e.target.checked;update(s=>({...s,items:checked?[...new Set([...s.items,id])]:s.items.filter(x=>x!==id)}));}if(e.target.id==='motion'){const checked=e.target.checked;update(s=>({...s,motion:checked}));}if(e.target.id==='record-date')recordDate=e.target.value;});
document.addEventListener('input',e=>{if(e.target.type==='range')document.querySelector('#out-'+e.target.name).value=e.target.value;});
document.addEventListener('submit',async e=>{if(e.target.id!=='daily')return;e.preventDefault();const date=activeNotice.ref;const values=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,+v]));activeNotice=null;if(await update(s=>setCurrent(s,s.role,values,date)))toast('今日の冒険を記録した！ おつかれさま ♥');});
window.addEventListener('storage',()=>{try{state=repository.load();render();}catch{toast('保存データを再読込できません');}});
let timeSignature='';
function tick(){const sig=[nextAction(now())?.id,quests.filter(q=>unlocked(q,now())).map(q=>q.id).join(),recoveryEvents.filter(e=>Date.parse(e.availableAt)<=now()).map(e=>e.id).join(),eligibleDates().join(),actions.filter(a=>unlocked(a,now())).length].join('|');if(sig!==timeSignature){timeSignature=sig;if(!opening&&!activeNotice&&page!=='settings')render();}const a=nextAction(now()),el=document.querySelector('#countdown');if(el&&a)el.textContent=remaining(Date.parse(a.at));promptPending();}
render();if(!state.seen)startOpening();else promptPending();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

</script></body></html>
