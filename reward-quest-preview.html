function status(){if(!sharedReady())return `<div class="pageheading"><span class="eyebrow">PARTY STATUS</span><h1>ふたりのステータス</h1></div>${authPanel()}`;const available=recoveryEvents.filter(e=>Date.parse(e.availableAt)<=now());const eligible=eligibleDates();return `<div class="pageheading"><span class="eyebrow">PARTY & RECOVERY</span><h1>ふたりのステータス</h1><p>休むたびに、冒険の器が大きくなる。</p></div>${players()}<h2>回復イベント</h2><p class="notice">時刻になるとイベントが届きます。「あとで」のイベントもここから達成できます。</p><div class="events">${available.map(e=>{const effect=eventEffect(e),done=state.done.includes(e.id);return `<button data-event="${e.id}" ${done?'disabled':''}><span class="eventicon">${effect.icon}</span><span><small>DAY ${e.day} / ${e.availableAt.slice(11,16)}</small><strong>${effect.name}</strong><small>${effectDescription(effect)}</small></span><b>${done?'✓':'＋'}</b></button>`;}).join('')||'<div class="panel">まだ回復イベントはありません。旅の時間をお楽しみに。</div>'}</div><div class="panel"><span class="eyebrow">TODAY’S STATUS</span><h2>今日の冒険はどうだった？</h2><p>DAY1・2は21時から入力できます。最終日は15時から、帰宅後や後日も記録できます。</p>${eligible.length?`<label>記録する日<select id="record-date">${eligible.map(date=>`<option ${date===(recordDate||eligible.at(-1))?'selected':''}>${date}</option>`).join('')}</select></label><button class="primary" id="open-record">${myRole()==='groom'?'新郎':'新婦'}のステータスを記録</button>`:'<p class="notice">夜になったら、入力をご案内します。</p>'}</div><h2>保存した夜の記録</h2>${Object.entries(state.logs).map(([key,v])=>`<div class="log-entry"><b>${esc(key.replace(':groom',' 新郎').replace(':bride',' 新婦'))}</b><p>${Object.entries(v).map(([k,n])=>`${labels[k]} ${n}`).join(' / ')}</p></div>`).join('')||'<p class="notice">まだ記録はありません。</p>'}`;}
const effectDescription=e=>[...Object.entries(e.max).map(([k,v])=>`最大${labels[k]} +${v}`),...Object.entries(e.current).map(([k,v])=>`${labels[k]} ${v>0?'+':''}${v}`)].join(' / ');
function item(){return `<div class="pageheading"><span class="eyebrow">ADVENTURE BAG</span><h1>旅のどうぐ</h1><p>忘れものをチェックして出発！</p></div><div class="panel green"><h2>防寒そうびを忘れずに</h2><p>標高の高い場所は秋の終わりに冷え込みます。重ね着・防寒小物・歩きやすい靴を準備しよう。</p></div><div class="sectionhead"><h2>持ち物</h2><span class="badge" id="item-count" aria-live="polite">${state.items.length} / ${items.length}</span></div><div class="checklist">${items.map((s,i)=>`<label><input type="checkbox" data-item="${i}" ${state.items.includes(i)?'checked':''}><span>${s}</span></label>`).join('')}</div><div class="panel"><h2>冒険の心得</h2><p>体調をいちばん大切に。<br>水分補給とこまめな休憩。<br>無理せず、ふたりのペースで。</p></div>`;}
function settings(){return `<div class="pageheading"><span class="eyebrow">SYSTEM MENU</span><h1>冒険の設定</h1></div>${authPanel()}<div class="panel"><h2>表示モード</h2><p>${state.role==='bride'?'新婦用：すべての旅程を表示':'新郎用：未訪問の場所名を伏せて表示'}。URLのroleは表示だけに使用し、Googleアカウントの権限とは別です。</p><p class="notice">?role=bride / ?role=groom（省略時は新郎）</p></div><div class="panel"><h2>演出</h2><label class="toggle"><input id="motion" type="checkbox" ${state.motion?'checked':''}>アニメーションを使う</label><button id="replay" class="secondary">22秒のオープニングを再視聴</button></div><div class="panel"><h2>保存状態</h2><p>${esc(storageError||'この端末に保存中')}<br>持ち物・演出・旅程編集はこの端末だけ。ステータスと達成はログイン後に共有します。</p><button id="export" class="secondary">バックアップをダウンロード</button></div><div class="panel"><h2>表示確認用のデモ日時（日本時間）</h2><p>表示だけを早送りします。共有報酬・達成の時刻は実際の時刻とFirestore Rulesで判定するため、未来の報酬は受け取れません。</p><input id="clock" type="datetime-local" value="${new Date(now()+32400000).toISOString().slice(0,16)}"><button id="setclock" class="primary">この時刻で冒険する</button><button id="realclock" class="secondary">現在の時刻に戻す</button></div>`;}
function render(){configureSchedule(state.plan);document.body.classList.toggle('reduced',reduced());app.innerHTML=`<div class="shell"><header class="topbar"><a href="#home" data-page="home" class="brand">♥ <span>REWARD QUEST</span></a><span class="topright">${preview===null?'FIREBASE':'DEMO TIME'} <i>●</i></span></header><div id="save-error" role="alert" class="error" ${storageError?'':'hidden'}>${esc(storageError)}</div><main id="main" class="${lastRenderedPage===page?'no-transition':''}">${({home,quest,status,item,settings})[page]()}</main><nav aria-label="メインメニュー">${[['home','⌂','HOME'],['quest','⚑','QUEST'],['status','♡','STATUS'],['item','▣','ITEM'],['settings','⚙','SYSTEM']].map(([id,icon,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}><span>${navIcon(id)}</span><small>${name}</small></button>`).join('')}</nav></div>`;lastRenderedPage=page;if(opening)drawOpening();else if(activeNotice)drawNotice();}
function showModal(content,label){const d=document.createElement('dialog');d.className='game-dialog';d.setAttribute('aria-label',label);d.innerHTML=content;d.addEventListener('cancel',e=>{e.preventDefault();if(activeNotice?.notification)ackNotice();else closeModal();});app.append(d);d.showModal();return d;}
function drawNotice(){const n=activeNotice;if(n.type==='level'){drawGrowth(n);return;}if(n.type==='edit'){drawEditor(n);return;}if(n.type==='record'){const date=n.ref,role=myRole(),saved=state.logs[`${date}:${role}`];showModal(`<form id="daily"><span class="eyebrow">TODAY’S STATUS / ${date}</span><h2>今日の冒険はどうだった？</h2><p>${role==='groom'?'新郎':'新婦'}の現在値を入力</p>${Object.entries(state.players[role]).map(([k,v])=>`<label class="sliderlabel">${labels[k]} <output id="out-${k}">${saved?.[k]??v[0]}</output><input name="${k}" type="range" min="0" max="${v[1]}" value="${saved?.[k]??v[0]}"></label>`).join('')}<p class="notice">保存すると現在のステータスにも反映します。</p><button class="primary" type="submit">記録を保存する</button><button class="secondary" type="button" data-dismiss>あとで</button></form>`,'ステータス入力');return;}let buttons='';if(n.type==='event')buttons=`<button class="primary" data-event="${n.ref}">達成した！</button>`;if(n.type==='status')buttons=`<button class="primary" id="notice-record">入力する</button>`;if(n.type==='quest'||n.type==='final')buttons=`<button class="primary" id="notice-quest">しおりを見る</button>`;showModal(`<div class="popup-art">${n.type==='level'?'✦':n.type==='final'?'★':'⚑'}</div><span class="eyebrow">${esc(n.title)}</span><h2>${esc(n.ref&&['quest','final'].includes(n.type)?questTitle(quests.find(q=>q.id===n.ref),state.role,now()):n.text)}</h2>${n.type==='event'?`<p class="notice">${effectDescription(eventEffect(recoveryEvents.find(e=>e.id===n.ref)))}</p>`:''}${n.type==='final'?'<p>おつかれさま！達成はしおりのボタンで記録しよう。最終日のステータスも保存できます。</p>':''}${buttons}<button class="secondary" data-dismiss>${n.type==='event'||n.type==='status'?'あとで':'とじる'}</button><small class="notice">${n.notification?`未確認のお知らせ ${myNotifications().length}件 / 確認後は再表示しません`:''}</small>`,n.title);}
function closeModal(){activeNotice=null;refreshOverlay();}
async function ackNotice(){const n=activeNotice;if(!n)return;activeNotice=null;if(n.notification)await update(s=>({...s,ack:[...new Set([...s.ack,`${myRole()}:${n.id}`])]}),{redraw:false});refreshOverlay();}
function promptPending(){if(!sharedReady()||opening||activeNotice||page==='settings'||storageError||document.hidden)return;const pending=myNotifications();if(pending.length){activeNotice={...pending[0],notification:true};refreshOverlay();}}
function finishOpening(){timers.forEach(clearTimeout);timers=[];opening=false;scene=0;page='home';return update(s=>({...s,seen:true})).then(()=>setTimeout(promptPending,1200));}
function startOpening(){timers.forEach(clearTimeout);activeNotice=null;opening=true;scene=0;render();for(const [ms,s] of [[openingTiming.homecoming,1],[openingTiming.unlock,2]])timers.push(setTimeout(()=>{scene=s;render();},ms));timers.push(setTimeout(finishOpening,openingTiming.end));}
function drawOpening(){const overlay=document.createElement('div');overlay.className=`opening scene${scene}`;overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','冒険のプロローグ');overlay.setAttribute('aria-modal','true');overlay.innerHTML=`<button id="skip" class="skip">スキップ →</button><div class="introcontent"><span class="eyebrow">${scene===0?'2026.10.10 · WEDDING DAY':scene===1?'AFTER THE MAIN QUEST':'A NEW CHAPTER'}</span><div class="introart">${scene===0?'<div class="chapel">♧<br>▦ ▦<br>▥</div>':scene===1?'<div class="bed">▰</div>':'<div class="quest-notify">✦ NEW QUEST UNLOCKED! ✦</div>'}${pair()}${scene===0?Array.from({length:24},(_,i)=>`<i class="petal" style="--x:${i*4.2}%;--delay:${i%7*.4}s"></i>`).join(''):''}</div><h1>${scene===0?'MAIN QUEST CLEAR!':scene===1?'おうちへ帰還……':'結婚式お疲れ様旅行'}</h1><p>${scene===0?'結婚式が大成功！<br>わーい！ わーい！':scene===1?'長い冒険を終えた2人は、<br>すっかり疲れ果ててしまった……':'〜クリア後のごほうびクエスト〜'}</p>${scene===1?'<div class="intro-gauge">HP <i></i></div><div class="intro-gauge">MP <i></i></div>':''}<div class="scene-dots">${[0,1,2].map(n=>`<i class="${Math.min(scene,2)===n?'active':''}"></i>`).join('')}</div></div>`;app.append(overlay);app.querySelector('.shell').inert=true;overlay.querySelector('button').focus();}
async function completeEvent(id){const e=recoveryEvents.find(e=>e.id===id);if(completing||!e||state.done.includes(id)||Date.parse(e.availableAt)>now())return;completing=true;let applied=false,beforePlayers=null;const pending=activeNotice;activeNotice=null;const success=await update(s=>{let n=applyEvent(s,id,now());if(n===s)return s;beforePlayers=structuredClone(s.players);applied=true;if(pending?.notification)n.ack.push(`${myRole()}:${pending.id}`);return n;});completing=false;if(success&&applied&&!repository.lastSharedChange)toast('実際の時刻では未解放、または他の端末で達成済みです。');if(success&&applied&&repository.lastSharedChange){const effect=eventEffect(e);activeNotice={type:'level',title:'LEVEL UP!',text:'ふたりのステータスが大きく成長した！',growth:effect.max,before:beforePlayers,after:structuredClone(state.players)};refreshOverlay();}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;
if(b.dataset.page){e.preventDefault();page=b.dataset.page;render();window.scrollTo(0,0);}if(b.dataset.today){selectedDay=+b.dataset.today;page='quest';render();window.scrollTo(0,0);}if(b.dataset.day){selectedDay=+b.dataset.day;render();}
if(b.dataset.clear){const id=b.dataset.clear;if(await update(s=>clearQuest(s,id,now())))toast(repository.lastSharedChange?'✓ QUEST CLEAR! 達成記録を保存した！':'実際の時刻では未解放、または他の端末で達成済みです。');}
if(b.dataset.event)await completeEvent(b.dataset.event);
if(b.dataset.editAction)openEditor('actions',b.dataset.editAction);if(b.dataset.editQuest)openEditor('quests',b.dataset.editQuest);if(b.dataset.bus){const y=window.scrollY;if(await update(s=>({...s,plan:{...s.plan,bus:b.dataset.bus}})))window.scrollTo(0,y);}

if(b.id==='replay')startOpening();if(b.id==='skip')await finishOpening();
if(b.hasAttribute('data-dismiss')){await ackNotice();}
if(b.id==='notice-quest'){const q=quests.find(q=>q.id===activeNotice.ref);page='quest';selectedDay=q.day;await ackNotice();render();}
if(b.id==='notice-record'){const date=activeNotice.ref;await ackNotice();activeNotice={type:'record',ref:date};refreshOverlay();}
if(b.id==='open-record'){const date=document.querySelector('#record-date').value;activeNotice={type:'record',ref:date};refreshOverlay();}
if(b.id==='setclock'){const value=document.querySelector('#clock').value;const t=Date.parse(value+':00+09:00');if(Number.isFinite(t)){preview=t;previewStarted=Date.now();render();toast('デモ時刻を変更しました');}}
if(b.id==='realclock'){preview=null;render();}
if(b.id==='login'){try{await repository.login();}catch(error){toast(error.message);}}if(b.id==='logout'){await repository.logout();}if(b.id==='create-shared'){try{await repository.createShared();toast('共有データを新規作成しました');}catch(error){toast(error.message);}}
if(b.id==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({current:state,legacy:repository.legacyBackup()},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='reward-quest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
document.addEventListener('change',async e=>{if(e.target.dataset.item!==undefined){await saveItem(e.target);}if(e.target.id==='motion'){const checked=e.target.checked;update(s=>({...s,motion:checked}),{redraw:false}).then(()=>{e.target.checked=state.motion;document.body.classList.toggle('reduced',reduced());});}if(e.target.id==='record-date')recordDate=e.target.value;});
document.addEventListener('input',e=>{if(e.target.type==='range')document.querySelector('#out-'+e.target.name).value=e.target.value;});
document.addEventListener('submit',async e=>{if(e.target.id==='itinerary-editor'){e.preventDefault();const patch=Object.fromEntries(new FormData(e.target));const n=activeNotice,y=window.scrollY;if(await update(s=>editPlan(s,n.kind,n.ref,patch),{redraw:false})){activeNotice=null;render();window.scrollTo(0,y);toast('旅程を保存しました');}return;}if(e.target.id!=='daily')return;e.preventDefault();const date=activeNotice.ref;const values=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,+v]));activeNotice=null;if(await update(s=>setCurrent(s,myRole(),values,date)))toast('今日の冒険を記録した！ おつかれさま ♥');});
window.addEventListener('storage',()=>{try{state=repository.load();configureSchedule(state.plan);if(page==='item')refreshItemUI();else render();}catch{toast('保存データを再読込できません');}});
let timeSignature='';
function tick(){const sig=[nextAction(now())?.id,quests.filter(q=>unlocked(q,now())).map(q=>q.id).join(),recoveryEvents.filter(e=>Date.parse(e.availableAt)<=now()).map(e=>e.id).join(),eligibleDates().join(),actions.filter(a=>unlocked(a,now())).length,actions.filter(a=>Date.parse(a.at)<=now()).length].join('|');if(sig!==timeSignature){timeSignature=sig;if(!opening&&!activeNotice&&!['settings','item'].includes(page))render();}const a=nextAction(now()),el=document.querySelector('#countdown');if(el&&a)el.textContent=remaining(Date.parse(a.at));const busEl=document.querySelector('#bus-countdown');if(busEl){const target=now()<Date.parse(returnTarget().at)?returnTarget():returnBus();busEl.textContent=`${target.id===returnTarget().id?'バス停へ戻る目安まで':'帰還バス出発まで'} ${remaining(Date.parse(target.at))}`;}promptPending();}
render();if(!state.seen)startOpening();else promptPending();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

function openEditor(kind,id){if(state.role!=='bride')return;activeNotice={type:'edit',kind,ref:id};refreshOverlay();}
function drawEditor(n){const row=(n.kind==='actions'?actions:quests).find(a=>a.id===n.ref);const fields=n.kind==='actions'?[['time','行動時刻','time'],['detail','詳細な行動','text'],['safeText','編集内容の解放前に表示する行動','text'],['note','詳細な補足','textarea'],['safeNote','解放前の補足','textarea'],['revealTime','編集した詳細を解放する時刻','time']]:[['title','クエスト名','text'],['revealTime','情報解放時刻','time']];
 showModal(`<form id="itinerary-editor"><span class="eyebrow">ITINERARY EDITOR</span><h2>DAY ${row.day}の旅程を編集</h2>${fields.map(([key,label,type])=>`<label class="editor-label">${label}${type==='textarea'?`<textarea name="${key}">${esc(row[key]||'')}</textarea>`:`<input name="${key}" type="${type}" value="${esc(row[key]||'')}" required>`}</label>`).join('')}<p class="notice">この端末だけに保存します。訪問行の時刻を変えると、その場所名の公開時刻も追従します。編集した行の詳細は指定解放時刻まで伏せます。</p><button class="primary" type="submit">変更を保存</button><button class="secondary" type="button" data-dismiss>キャンセル</button></form>`,'旅程編集');
}
document.addEventListener('error',e=>{const image=e.target;if(image?.dataset?.character){image.hidden=true;const fallback=image.nextElementSibling;if(fallback)fallback.hidden=false;}},true);

let growthAnimation=0;
function drawGrowth(n){
 const reducedMotion=reduced();
 const cards=['groom','bride'].map(role=>`<article class="growth-player"><header>${sprite(role)}<h3>${role==='groom'?'新郎':'新婦'}</h3></header>${Object.entries(n.growth).map(([key,gain])=>{
  const before=n.before[role][key][1],after=n.after[role][key][1];
  return `<div class="growth-stat"><span>最大${labels[key]}</span><strong>＋${gain}！</strong><div><span>${before} → </span><b data-growth-count data-from="${before}" data-to="${after}">${reducedMotion?after:before}</b></div><div class="growth-track"><i data-growth-bar data-from="${before/after*100}" style="width:${reducedMotion?100:before/after*100}%"></i></div></div>`;
 }).join('')}</article>`).join('');
 showModal(`<div class="popup-art">✦</div><span class="eyebrow">EVENT CLEAR!</span><h2 class="level-title">LEVEL UP!</h2><p>ふたりの冒険の器が大きくなった！</p><div class="growth-cards">${cards}</div><button class="primary" data-dismiss>成長を受け取った！</button>`,'レベルアップ');
 const token=++growthAnimation;if(reducedMotion)return;
 const started=performance.now();
 function frame(t){if(token!==growthAnimation||activeNotice!==n)return;const p=Math.min(1,Math.max(0,(t-started)/1400));const eased=1-(1-p)**3;
  for(const el of document.querySelectorAll('[data-growth-count]'))el.textContent=Math.round(+el.dataset.from+(+el.dataset.to-+el.dataset.from)*eased);
  for(const el of document.querySelectorAll('[data-growth-bar]'))el.style.width=(+el.dataset.from+(100-+el.dataset.from)*eased)+'%';
  if(p<1)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}


function authPanel(){const session=repository.session;
 const titles={unconfigured:'Firebaseの設定が必要です','signed-out':'Googleアカウントでログイン',unauthorized:'このアカウントは未許可です',loading:'共有データを確認しています',ready:'夫婦のデータを共有中',missing:'共有データは未作成です',denied:'Firestoreのアクセスが拒否されました',error:'共有データに接続できません'};
 return `<section class="panel auth-panel"><span class="eyebrow">GOOGLE LOGIN / SHARED PARTY</span><h2>${titles[session.status]||'接続準備中'}</h2><p>${esc(session.message||'共有ステータスは許可された2人だけが閲覧・更新できます。持ち物チェックはログインなしで使えます。')}</p>${session.missing?.length?`<p class="notice">不足：${session.missing.map(esc).join(' / ')}</p>`:''}${session.user?`<p class="notice">ログイン中：${esc(session.user.email||'Googleユーザー')}<br>Firebase UID：<code>${esc(session.user.uid)}</code>${session.player?`<br>編集できる現在値：${session.player==='groom'?'新郎':'新婦'}`:''}</p><button class="secondary" id="logout">ログアウト</button>`:`<button class="primary" id="login">Googleでログイン</button>`}${session.status==='missing'?'<p class="notice">初期値から新規作成します。旧端末の数値を自動アップロードしません。既に存在するドキュメントは上書きしません。</p><button class="primary" id="create-shared">共有データを新規作成</button>':''}</section>`;
}
repository.subscribe(()=>{try{state=repository.load();localLoadFailed=false;}catch(error){state=fresh();localLoadFailed=true;storageError=error.message;}configureSchedule(state.plan);if(!sharedReady())activeNotice=null;if(page==='item'&&!opening){refreshItemUI();return;}render();});
repository.start();

</script></body></html>
