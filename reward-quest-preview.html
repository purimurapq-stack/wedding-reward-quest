</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script type="module">
// 公開可能な架空データのみ。実旅程をここへコピーしないでください。
const labels={hp:'HP',mp:'MP',hunger:'空腹度',joy:'幸福度'};
const initial={bride:{hp:[30,100],mp:[20,80],hunger:[40,100],joy:[100,100]},groom:{hp:[40,100],mp:[30,80],hunger:[40,100],joy:[100,100]}};
const items=['スマートフォン','充電器','モバイルバッテリー','財布','身分証','乗車券','防寒着','厚手の靴下','歩きやすい靴','手袋','マフラー','折りたたみ傘','常備薬','スキンケア用品'];
const effects=[{id:'bath',name:'温泉に入った',icon:'♨',max:{hp:10},current:{hp:20}},{id:'meal',name:'おいしいご飯を食べた',icon:'♜',max:{hp:5},current:{hunger:-30}},{id:'view',name:'絶景を見た',icon:'✧',max:{mp:10},current:{joy:10}},{id:'rest',name:'ホテルでのんびりした',icon:'☕',max:{mp:5},current:{mp:20}},{id:'sleep',name:'ぐっすり眠った',icon:'☾',max:{hp:5},current:{hp:30}}];
const titles=[['冒険のはじまり','風の列車に乗って','秘密の拠点を発見！','回復の時間','今日もおつかれさま'],['自然探索へ出発','天空の絶景を発見せよ！','高原の宝物を探せ！','回復の拠点へ帰還せよ！','星空の休息'],['最後のリラックスタイム','帰還クエスト','QUEST COMPLETE!']];
const quests=titles.flatMap((a,d)=>a.map((title,i)=>({id:`d${d+1}-${i}`,day:d+1,at:`${['2026-10-31','2026-11-01','2026-11-02'][d]}T${String([9,12,15,18,21][i]).padStart(2,'0')}:00:00+09:00`,title,location:['こもれびの出発広場','星の列車','雲の宿','月の温泉','星あかりの部屋'][i],detail:'これは架空のデモ予定です。ふたりのペースで、ひと休みしながら進もう。',verify:true})));
const themes=['冒険の始まり','天空の絶景を探せ！','冒険の終わり、そして帰還'];


const fresh=()=>({version:1,players:structuredClone(initial),done:[],items:[],role:'groom',motion:true,seen:false,logs:{}});
const unlocked=(q,now)=>Date.parse(q.at)<=now;
function applyEvent(state,id,day){const key=`${day}:${id}`;const effect=effects.find(e=>e.id===id);if(!effect||state.done.includes(key))return state;const next=structuredClone(state);for(const p of Object.values(next.players)){for(const k of Object.keys(p)){p[k][1]+=effect.max[k]||0;p[k][0]=Math.max(0,Math.min(p[k][1],p[k][0]+(effect.current[k]||0)));}}next.done.push(key);return next;}
function setCurrent(state,role,values,date){const next=structuredClone(state);for(const [k,v] of Object.entries(values)){if(!next.players[role]?.[k]||!Number.isFinite(v))throw Error('入力値を確認してください');next.players[role][k][0]=Math.max(0,Math.min(next.players[role][k][1],Math.round(v)));}next.logs[`${date}:${role}`]={...values};return next;}
const tokyoDate=now=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(now);
const tripDay=now=>Math.max(1,Math.min(3,Math.floor((Date.parse(tokyoDate(now)+'T00:00:00+09:00')-Date.parse('2026-10-31T00:00:00+09:00'))/86400000)+1));


const KEY='reward-quest-v1';
// Replace this adapter with an authenticated API. Never trust role or time from a client in production.
const repository={load(){const raw=localStorage.getItem(KEY);if(!raw)return fresh();const s=JSON.parse(raw);if(s.version!==1||!s.players||!Array.isArray(s.done)||!Array.isArray(s.items))throw Error('保存データを読み込めません。バックアップをご確認ください。');for(const role of ['bride','groom'])for(const k of ['hp','mp','hunger','joy']){const a=s.players[role]?.[k];if(!Array.isArray(a)||a.length!==2||!a.every(Number.isFinite)||a[0]<0||a[1]<=0||a[0]>a[1])throw Error('保存データの形式が不正です');}return s;},save(s){localStorage.setItem(KEY,JSON.stringify(s));},async transact(fn){if(navigator.locks)return navigator.locks.request(KEY,()=>{const next=fn(this.load());this.save(next);return next;});const next=fn(this.load());this.save(next);return next;}};


let state,storageError='';try{state=repository.load();}catch(e){state=fresh();storageError=e.message;}let page='home',selectedDay=1,preview=null,opening=false,scene=0,timers=[],lastUnlocked=[],detail=null;const app=document.querySelector('#app');const now=()=>preview??Date.now();const reduced=()=>!state.motion||matchMedia('(prefers-reduced-motion: reduce)').matches;
const sprite=(role)=>`<svg class="sprite ${role}" viewBox="0 0 16 22" role="img" aria-label="${role==='bride'?'新婦':'新郎'}のドット絵" shape-rendering="crispEdges"><g fill="${role==='bride'?'#765042':'#424451'}"><path d="M5 1h6v1h2v7H3V3h2z"/></g><path fill="#f6c5a7" d="M5 4h6v2h1v4h-2v1H6v-1H4V6h1z"/><path fill="#4b424a" d="M6 6h1v1H6zm4 0h1v1h-1z"/><path fill="${role==='bride'?'#fffaf3':'#687d91'}" d="M5 11h6v2h2v6H3v-6h2z"/><path fill="${role==='bride'?'#ead4cf':'#424451'}" d="M4 19h3v3H4zm5 0h3v3H9z"/><g class="arms" fill="#f6c5a7"><path d="M1 10h2v5H1zm12 0h2v5h-2z"/></g>${role==='bride'?'<path fill="#fff" d="M3 2h10v2H3zM2 4h2v7H2zm10 0h2v7h-2z"/><path fill="#e898a8" d="M7 13h3v3H7z"/>':'<path fill="#f2c988" d="M7 11h2v4H7z"/>'}</svg>`;
const pair=()=>`<div class="couple">${sprite('groom')}<span class="heart">♥</span>${sprite('bride')}</div>`;
const landscape=()=>`<div class="landscape"><span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span><div class="mount m1"></div><div class="mount m2"></div><div class="mount m3"></div><div class="trail"></div><span class="tree t1">♠</span><span class="tree t2">♠</span><span class="flowers">✿ · ✿</span>${pair()}<span class="spark s1">✦</span><span class="spark s2">✦</span></div>`;
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500);}
async function update(fn){try{state=await repository.transact(fn);storageError='';render();return true;}catch(e){storageError='保存できません。ブラウザの保存設定・空き容量をご確認ください。';render();toast(storageError);return false;}}
const bar=(key,value)=>`<div class="statline"><span>${labels[key]}</span><b>${value[0]} <small>/ ${value[1]}</small></b><div class="track"><i class="${key}" style="width:${100*value[0]/value[1]}%"></i></div></div>`;
const players=()=>`<div class="players">${['groom','bride'].map(r=>`<article class="player"><header>${sprite(r)}<div><span class="eyebrow">PLAYER ${r==='groom'?'01':'02'}</span><h3>${r==='groom'?'新郎':'新婦'}<small> Lv.${1+state.done.length}</small></h3></div></header>${Object.entries(state.players[r]).map(([k,v])=>bar(k,v)).join('')}</article>`).join('')}</div>`;
const dateText=()=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(now());
function countdown(){const next=quests.find(q=>!unlocked(q,now()));if(!next)return 'すべてのクエストが解放されました';let sec=Math.max(0,Math.floor((Date.parse(next.at)-now())/1000));return `${Math.floor(sec/3600)}:${String(Math.floor(sec/60)%60).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function home(){const available=quests.filter(q=>unlocked(q,now()));return `<section class="hero"><span class="eyebrow">A LITTLE ADVENTURE FOR TWO</span><h1>結婚式お疲れ様旅行</h1><p class="subtitle">クリア後のごほうびクエスト</p><div class="datepill">2026.10.31 SAT — 11.02 MON</div>${landscape()}<div class="message"><span class="message-label">✦ ふたりの新しい冒険</span><p>たくさんがんばった、ふたりへ。<br>今度のクエストは、ゆっくり幸せになること。</p><span class="triangle">▼</span></div></section><div class="sectionhead"><h2>ふたりのステータス</h2><button data-page="status" class="textbtn">詳しく →</button></div>${players()}<div class="sectionhead"><h2>いまのクエスト</h2><span class="badge">${dateText()}</span></div><button class="quest-feature" ${available.length?`data-detail="${available.at(-1).id}"`:'data-page="quest"'}><span class="questicon">${available.length?'✧':'♜'}</span><span><small>${available.length?'QUEST UNLOCKED':'旅のはじまりを待っています'}</small><strong>${available.at(-1)?.title||'もうすぐ、ごほうびの時間。'}</strong><span>ふたりのペースで冒険しよう</span></span><b>›</b></button><div class="countdown"><span>次のクエスト解放まで</span><b id="countdown">${countdown()}</b></div><p class="footnote">結婚式クリア：2026.10.10 ♥　新しい思い出を、ふたりで。</p>`;}
function quest(){return `<div class="pageheading"><span class="eyebrow">QUEST JOURNAL</span><h1>ごほうびの冒険</h1><p>ひとつずつ、旅の扉が開いていく。</p></div><div class="tabs">${[1,2,3].map(d=>`<button data-day="${d}" aria-pressed="${selectedDay===d}">DAY ${d}<small>${['10/31','11/1','11/2'][d-1]}</small></button>`).join('')}</div><h2>${themes[selectedDay-1]}</h2><p class="notice">架空のデモ予定です。新婦表示では全予定を確認できます。</p><div class="timeline">${quests.filter(q=>q.day===selectedDay).map(q=>{const open=state.role==='bride'||unlocked(q,now());return `<button class="questrow ${open?'':'locked'}" ${open?`data-detail="${q.id}"`:'disabled'}><time>${q.at.slice(11,16)}</time><span class="node">${open?'✧':'▣'}</span><span><small>${open?'DAY '+q.day+' / 要確認':'LOCKED'}</small><strong>${open?q.title:'まだ見ぬクエスト'}</strong><span>${open?q.location:'時間になると解放されます'}</span></span><b>${open?'›':'⌑'}</b></button>`;}).join('')}</div>`;}
function status(){const day=tripDay(now()),role=state.role;return `<div class="pageheading"><span class="eyebrow">OUR PARTY</span><h1>ふたりの成長記録</h1><p>休むことだって、立派なレベルアップ。</p></div>${players()}<h2>DAY ${day} の回復イベント</h2><p class="notice">達成するとふたりに適用。各イベントは1日1回です。</p><div class="events">${effects.map(e=>{const done=state.done.includes(`${day}:${e.id}`);return `<button data-event="${e.id}" ${done?'disabled':''}><span class="eventicon">${e.icon}</span><span><strong>${e.name}</strong><small>${Object.entries(e.max).map(([k,v])=>`最大${labels[k]} +${v}`).join(' / ')} · ${Object.entries(e.current).map(([k,v])=>`${labels[k]} ${v>0?'+':''}${v}`).join(' / ')}</small></span><b>${done?'✓':'＋'}</b></button>`;}).join('')}</div><form id="daily" class="panel"><span class="eyebrow">GOOD NIGHT, ADVENTURERS</span><h2>今日の調子はどう？</h2><p>${role==='groom'?'新郎':'新婦'}の現在値をまとめて保存</p>${Object.entries(state.players[role]).map(([k,v])=>`<label class="sliderlabel">${labels[k]} <output id="out-${k}">${v[0]}</output><input name="${k}" type="range" min="0" max="${v[1]}" value="${v[0]}"></label>`).join('')}<button class="primary" type="submit">今日のステータスを保存</button><small>${state.logs[`${tokyoDate(now())}:${role}`]?'✓ 今日の入力は保存済みです':'入力はいつでも更新できます'}</small></form><h2>達成のあしあと</h2><p class="notice">${state.done.length?state.done.map(k=>{const[d,id]=k.split(':');return `DAY ${d}：${effects.find(e=>e.id===id)?.name||id}`;}).join('<br>'):'最初の回復イベントを楽しもう。'}</p>`;}
function item(){return `<div class="pageheading"><span class="eyebrow">ADVENTURE BAG</span><h1>旅じたく</h1><p>忘れものはない？ 心は身軽に。</p></div><div class="panel green"><h2>♧ あたたかくして出発しよう</h2><p>標高の高いエリアは、秋の終わりにぐっと冷え込みます。重ね着・防寒小物・歩きやすい靴がおすすめ。</p></div><div class="sectionhead"><h2>持ち物リスト</h2><span class="badge">${state.items.length} / ${items.length}</span></div><div class="checklist">${items.map((s,i)=>`<label><input type="checkbox" data-item="${i}" ${state.items.includes(i)?'checked':''}><span>${s}</span></label>`).join('')}</div><div class="panel"><h2>冒険の心得</h2><p>予定より、ふたりの体調を大切に。<br>こまめに休憩、水分補給。<br>寒いときは無理せず、回復の拠点へ。</p></div>`;}
function settings(){return `<div class="pageheading"><span class="eyebrow">SETTINGS</span><h1>冒険の設定</h1></div><div class="panel"><h2>プレイヤー（デモ）</h2><p>認証機能ではありません。実際の旅行先は収録していません。</p><div class="tabs">${['groom','bride'].map(r=>`<button data-role="${r}" aria-pressed="${state.role===r}">${r==='groom'?'新郎':'新婦'}</button>`).join('')}</div></div><div class="panel"><h2>演出</h2><label class="toggle"><input id="motion" type="checkbox" ${state.motion?'checked':''}> アニメーションを使う</label><p>端末の「視差効果を減らす」設定も反映します。</p><button id="replay" class="secondary">オープニングをもう一度</button></div><div class="panel"><h2>保存とクラウド</h2><p>${storageError||'この端末のブラウザに保存しています。'}<br>別の端末との共有・ログインは未接続です。</p><button id="export" class="secondary">保存データをダウンロード</button></div><div class="panel"><h2>デモで解放を体験</h2><p>架空の旅を早送りできます。ステータスは保存されます。</p><label>表示日時（日本時間）<input id="clock" type="datetime-local" value="${new Date(now()+32400000).toISOString().slice(0,16)}"></label><button id="setclock" class="secondary">この時刻で試す</button><button id="realclock" class="textbtn">現在の時刻に戻す</button></div>`;}
function render(){document.body.classList.toggle('reduced',reduced());app.innerHTML=`<div class="shell"><header class="topbar"><a href="#home" data-page="home" class="brand">♥ <span>REWARD QUEST</span></a><span class="topright">${preview?'デモ時刻': 'LOCAL DEMO'} <i>●</i></span></header>${storageError?`<div role="alert" class="error">${storageError} この画面の変更は保存できない場合があります。</div>`:''}<main id="main">${({home,quest,status,item,settings})[page]()}</main><nav aria-label="メインメニュー">${[['home','⌂','HOME'],['quest','⚑','QUEST'],['status','♡','STATUS'],['item','♜','ITEM'],['settings','⚙','SETTINGS']].map(([id,icon,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}><span>${icon}</span><small>${name}</small></button>`).join('')}</nav></div>`;if(detail)showDetail(detail);if(opening)drawOpening();}
function showDetail(id){const q=quests.find(q=>q.id===id);if(!q||(state.role!=='bride'&&!unlocked(q,now())))return;detail=id;const dialog=document.createElement('dialog');dialog.innerHTML=`<span class="eyebrow">DAY ${q.day} · ${q.at.slice(11,16)} 解放</span><h2>${q.title}</h2><p>♧ ${q.location}</p><p>${q.detail}</p><p class="notice">要確認：架空の仮予定です。交通時刻は公式情報で確認してください。</p><button class="primary" id="close-detail">冒険にもどる</button>`;app.append(dialog);dialog.addEventListener('close',()=>{detail=null;dialog.remove();});dialog.showModal();}
function finishOpening(){timers.forEach(clearTimeout);timers=[];opening=false;scene=0;update(s=>({...s,seen:true}));}
function startOpening(){timers.forEach(clearTimeout);opening=true;scene=0;render();if(reduced())return;for(const [ms,s] of [[10000,1],[18000,2],[30000,3]])timers.push(setTimeout(()=>{scene=s;render();},ms));}
function drawOpening(){const overlay=document.createElement('div');overlay.className=`opening scene${scene}`;overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','冒険のプロローグ');overlay.setAttribute('aria-modal','true');overlay.innerHTML=`<button id="skip" class="skip">スキップ →</button><div class="introcontent"><span class="eyebrow">${scene===0?'2026.10.10 · WEDDING DAY':scene===1?'AFTER THE MAIN QUEST':'A NEW CHAPTER'}</span><div class="introart">${scene===0?'<div class="chapel">♧<br>▦ ▦<br>▥</div>':scene===1?'<div class="bed">▰</div>':'<div class="quest-notify">✧ NEW QUEST UNLOCKED! ✧</div>'}${pair()}${scene===0?Array.from({length:24},(_,i)=>`<i class="petal" style="--x:${i*4.2}%;--delay:${i%7*.4}s"></i>`).join(''):''}</div><h1>${scene===0?'MAIN QUEST CLEAR!':scene===1?'おうちへ帰還……':'結婚式お疲れ様旅行'}</h1><p>${scene===0?'結婚式を成功させた！<br>わーい！ わーい！':scene===1?'長い冒険を終えた2人は、<br>すっかり疲れ果ててしまった……':'クリア後のごほうびクエスト'}</p>${scene===1?'<div class="intro-gauge">HP <i></i></div><div class="intro-gauge">MP <i></i></div>':''}${scene>=3||reduced()?'<button class="primary" id="begin">冒険をはじめる！</button>':''}${reduced()&&scene<3?'<button id="nextscene" class="secondary">次へ</button>':''}<div class="scene-dots">${[0,1,2].map(n=>`<i class="${Math.min(scene,2)===n?'active':''}"></i>`).join('')}</div></div>`;app.append(overlay);app.querySelector('.shell').inert=true;overlay.querySelector('button').focus();}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.page){e.preventDefault();page=b.dataset.page;detail=null;render();window.scrollTo(0,0);}if(b.dataset.day){selectedDay=+b.dataset.day;render();}if(b.dataset.detail)showDetail(b.dataset.detail);if(b.id==='close-detail')b.closest('dialog').close();if(b.dataset.event){if(await update(s=>applyEvent(s,b.dataset.event,tripDay(now()))))toast('✧ LEVEL UP! ふたりの最大ステータスが成長した！');}if(b.dataset.role)update(s=>({...s,role:b.dataset.role}));if(b.id==='replay')startOpening();if(['skip','begin'].includes(b.id))finishOpening();if(b.id==='nextscene'){scene++;render();}if(b.id==='setclock'){const value=document.querySelector('#clock').value;const time=Date.parse(value+':00+09:00');if(Number.isFinite(time)){preview=time;render();toast('デモ時刻を変更しました');}}if(b.id==='realclock'){preview=null;render();}if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='reward-quest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
document.addEventListener('change',e=>{if(e.target.dataset.item!==undefined){const id=+e.target.dataset.item;update(s=>({...s,items:e.target.checked?[...new Set([...s.items,id])]:s.items.filter(x=>x!==id)}));}if(e.target.id==='motion')update(s=>({...s,motion:e.target.checked}));});
document.addEventListener('input',e=>{if(e.target.type==='range')document.querySelector('#out-'+e.target.name).value=e.target.value;});
document.addEventListener('submit',async e=>{if(e.target.id!=='daily')return;e.preventDefault();const values=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,+v]));if(await update(s=>setCurrent(s,s.role,values,tokyoDate(now()))))toast('今日の調子を保存しました。おつかれさま ♥');});
window.addEventListener('storage',()=>{try{state=repository.load();render();}catch{toast('保存データを再読込できません');}});
function tick(){const ids=quests.filter(q=>unlocked(q,now())).map(q=>q.id);if(ids.join()!==lastUnlocked.join()){if(lastUnlocked.length&&ids.length>lastUnlocked.length)toast('✧ NEW QUEST UNLOCKED! 新しい冒険が開きました');lastUnlocked=ids;render();}const el=document.querySelector('#countdown');if(el)el.textContent=countdown();}lastUnlocked=quests.filter(q=>unlocked(q,now())).map(q=>q.id);render();if(!state.seen)startOpening();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

</script></body></html>
