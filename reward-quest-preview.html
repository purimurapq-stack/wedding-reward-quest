const homeHourFormatter=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',hourCycle:'h23'});
function homePresentation(now){
 const date=homeDateFormatter.format(now),hour=Number(homeHourFormatter.format(now));
 const period=hour>=5&&hour<12?'morning':hour>=12&&hour<18?'afternoon':'night';
 const chapter=date<'2026-10-31'?'before':date>'2026-11-02'?'after':({'2026-10-31':'day1','2026-11-01':'day2','2026-11-02':'day3'})[date];
 const entry=homeChapters[chapter],background=period==='night'&&entry.nightBackground?entry.nightBackground:entry.background;
 return {key:`${chapter}:${entry.message?'fixed':period}`,chapter,period,title:entry.title,message:entry.message||entry.messages[period],background};
}

function sprite(role){const label=role==='bride'?'新婦':'新郎';return `<span class="character sprite ${role}"><img data-character="${role}" src="${characterAssets[role]}" alt="${label}" decoding="async"><span class="character-fallback" hidden>${label}<small>画像を読み込めません</small></span></span>`;}
const pair=()=>`<div class="couple">${sprite('groom')}<span class="heart">♥</span>${sprite('bride')}</div>`;
function landscape(background='wedding'){const scene=homeBackgrounds[background]||homeBackgrounds.wedding;return `<div class="landscape home-landscape scene-${background}" role="img" aria-label="${scene.label}"><div class="scenery-fallback" aria-hidden="true"><span class="sun"></span><div class="mount m1"></div><div class="mount m2"></div><div class="trail"></div></div><img class="home-scenery" data-background src="${scene.src}" alt="" decoding="async">${pair()}</div>`;}
function icon(name){const paths={home:'M2 8h2V6h2V4h4v2h2v2h2v6H9v-4H7v4H2z',quest:'M3 1h2v2h8v6H5v6H3z',status:'M2 4h4v2h2V4h4v6h-2v2H8v2H6v-2H4v-2H2z',item:'M2 5h12v9H2zM5 2h6v2H5z',settings:'M6 1h4v3h3v2h2v4h-3v3h-2v2H6v-3H3v-2H1V6h3V3h2z'};return `<svg class="pixel-icon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="${paths[name]||paths.quest}"/></svg>`;}






let state,storageError='',localLoadFailed=false;
try{state=repository.load();}catch(e){state=fresh();localLoadFailed=true;storageError=e.message;}
configureSchedule(state.plan);
let completing=false,lastRenderedPage=null;
const pendingItems=new Map();
let page='home',selectedDay=1,preview=null,previewStarted=0,opening=false,scene=0,timers=[],activeNotice=null,recordDate=null;
const navIcon=icon;
const app=document.querySelector('#app');
const gameReady=()=>!localLoadFailed;
const myRole=()=>state.role;
const myNotifications=()=>notifications({...state,role:myRole()},now());
const now=()=>preview===null?Date.now():preview+Date.now()-previewStarted;
const reduced=()=>!state.motion||matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000);}
async function update(fn,{redraw=true}={}){
 try{state=await repository.transact(fn);localLoadFailed=false;configureSchedule(state.plan);storageError='';if(redraw)render();else showSaveError('');return true;}
 catch(e){storageError=e.name==='QuotaExceededError'?'保存できません。ブラウザの空き容量を確認してください。':e.message||'保存できません。入力内容・接続を確認してください。';if(redraw)render();else showSaveError(storageError);toast(storageError);return false;}
}
function showSaveError(message){const el=document.querySelector('#save-error');if(el){el.textContent=message;el.hidden=!message;}}
function refreshItemUI(){const selected=new Set(state.items);for(const [id,checked] of pendingItems)checked?selected.add(id):selected.delete(id);for(const input of document.querySelectorAll('[data-item]'))input.checked=selected.has(+input.dataset.item);const count=document.querySelector('#item-count');if(count)count.textContent=`${selected.size} / ${items.length}`;}
async function saveItem(input){const id=+input.dataset.item,checked=input.checked;pendingItems.set(id,checked);input.disabled=true;refreshItemUI();
 const success=await update(s=>({...s,items:checked?[...new Set([...s.items,id])]:s.items.filter(x=>x!==id)}),{redraw:false});
 pendingItems.delete(id);input.disabled=false;refreshItemUI();return success;
}
function refreshOverlay(){document.querySelectorAll('dialog').forEach(d=>d.remove());if(activeNotice)drawNotice();}
const bar=(key,value)=>`<div class="statline"><span>${labels[key]}</span><b>${value[0]} <small>/ ${value[1]}</small></b><div class="track"><i class="${key}" style="width:${100*value[0]/value[1]}%"></i></div></div>`;
const players=()=>!gameReady()?storagePanel():`<div class="players">${['groom','bride'].map(r=>`<article class="player"><header>${sprite(r)}<div><span class="eyebrow">PLAYER ${r==='groom'?'01':'02'}</span><h3>${r==='groom'?'新郎':'新婦'}<small> Lv.${1+state.done.length}</small></h3></div></header>${Object.entries(state.players[r]).map(([k,v])=>bar(k,v)).join('')}</article>`).join('')}</div>`;
const formatDate=t=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(t);
function remaining(t){const s=Math.max(0,Math.ceil((t-now())/1000));return `${Math.floor(s/3600)}時間 ${String(Math.floor(s/60)%60).padStart(2,'0')}分 ${String(s%60).padStart(2,'0')}秒`;}
function busWarning(){const bus=returnBus(),target=returnTarget();if(!showBusWarning(now()))return '';
 const t=now()<Date.parse(target.at)?target:bus;
 return `<aside class="bus-warning"><strong>⚠️ バスの時間がやばいよ！ ${bus.time}のバスを逃すと帰還が困難になるぞ！</strong><p>${target.time}までにバス停へ戻ろう。${bus.time}発は必ず乗りたい帰還便。</p><b id="bus-countdown">${t.id===target.id?'バス停へ戻る目安まで':'帰還バス出発まで'} ${remaining(Date.parse(t.at))}</b></aside>`;
}
function nextCard(){const a=nextAction(now());return `<section class="next-action" id="next-action"><span class="eyebrow">▶ NEXT ACTION</span><h2>${a?`${a.time} ${esc(actionText(a,state.role,now()))}`:'次の行動はありません'}</h2><p>${a?`DAY ${a.day} / ${formatDate(Date.parse(a.at))} · 要確認`:'ふたりの冒険を、しおりで振り返ろう。'}</p>${a?`<div class="timer">次の行動まであと <b id="countdown">${remaining(Date.parse(a.at))}</b></div>`:''}${busWarning()}<button class="primary" data-today="${a?.day||tripDay(now())}">今日のスケジュールを見る →</button></section>`;}

function settings(){return `<div class="pageheading"><span class="eyebrow">SYSTEM MENU</span><h1>冒険の設定</h1></div>${storagePanel()}<div class="panel"><h2>表示モード</h2><p>${state.role==='bride'?'新婦用：すべての旅程を表示':'新郎用：未訪問の場所名を伏せて表示'}。URLのroleで新郎・新婦を表示します。ログインは不要です。</p><p class="notice">?role=bride / ?role=groom（省略時は新郎）</p></div><div class="panel"><h2>演出</h2><label class="toggle"><input id="motion" type="checkbox" ${state.motion?'checked':''}>アニメーションを使う</label><button id="replay" class="secondary">15秒のオープニングを再視聴</button></div><div class="panel"><h2>保存状態</h2><p>${esc(storageError||'この端末に保存中')}<br>ステータス・クエスト達成・持ち物はこの端末だけに保存します。相手の端末とは同期しません。</p><button id="export" class="secondary">バックアップをダウンロード</button></div>${state.role==='bride'?`<div class="panel"><h2>表示確認用のデモ日時（日本時間）</h2><p>表示とイベント解放を早送りします。デモで達成したイベントもこの端末に保存されます。巻き戻しても達成記録は残ります。</p><input id="clock" type="datetime-local" value="${new Date(now()+32400000).toISOString().slice(0,16)}"><button id="setclock" class="primary">この時刻で冒険する</button><button id="realclock" class="secondary">現在の時刻に戻す</button></div>`:''}`;}
function render(){configureSchedule(state.plan);document.body.classList.toggle('reduced',reduced());app.innerHTML=`<div class="shell"><header class="topbar"><a href="#home" data-page="home" class="brand">♥ <span>REWARD QUEST</span></a><span class="topright">${preview===null?'LOCAL SAVE':'DEMO TIME'} <i>●</i></span></header><div id="save-error" role="alert" class="error" ${storageError?'':'hidden'}>${esc(storageError)}</div><main id="main" class="${lastRenderedPage===page?'no-transition':''}">${({home,quest,status,item,settings})[page]()}</main><nav aria-label="メインメニュー">${[['home','⌂','HOME'],['quest','⚑','QUEST'],['status','♡','STATUS'],['item','▣','ITEM'],['settings','⚙','SYSTEM']].map(([id,icon,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}><span>${navIcon(id)}</span><small>${name}</small></button>`).join('')}</nav></div>`;lastRenderedPage=page;if(opening)drawOpening();else if(activeNotice)drawNotice();}

function drawNotice(){const n=activeNotice;if(n.type==='level'){drawGrowth(n);return;}if(n.type==='edit'){drawEditor(n);return;}if(n.type==='record'){const date=n.ref,role=myRole(),saved=state.logs[`${date}:${role}`];showModal(`<form id="daily"><span class="eyebrow">TODAY’S STATUS / ${date}</span><h2>今日の冒険はどうだった？</h2><p>${role==='groom'?'新郎':'新婦'}の現在値を入力</p>${Object.entries(state.players[role]).map(([k,v])=>`<label class="sliderlabel">${labels[k]} <output id="out-${k}">${saved?.[k]??v[0]}</output><input name="${k}" type="range" min="0" max="${v[1]}" value="${saved?.[k]??v[0]}"></label>`).join('')}<p class="notice">保存すると現在のステータスにも反映します。</p><button class="primary" type="submit">記録を保存する</button><button class="secondary" type="button" data-dismiss>あとで</button></form>`,'ステータス入力');return;}let buttons='';if(n.type==='event')buttons=`<button class="primary" data-event="${n.ref}">達成した！</button>`;if(n.type==='status')buttons=`<button class="primary" id="notice-record">入力する</button>`;if(n.type==='quest'||n.type==='final')buttons=`<button class="primary" id="notice-quest">しおりを見る</button>`;showModal(`<div class="popup-art">${n.type==='level'?'✦':n.type==='final'?'★':'⚑'}</div><span class="eyebrow">${esc(n.title)}</span><h2>${esc(n.ref&&['quest','final'].includes(n.type)?questTitle(quests.find(q=>q.id===n.ref),state.role,now()):n.text)}</h2>${n.type==='event'?`<p class="notice">${effectDescription(eventEffect(recoveryEvents.find(e=>e.id===n.ref)))}</p>`:''}${n.type==='final'?'<p>おつかれさま！達成はしおりのボタンで記録しよう。最終日のステータスも保存できます。</p>':''}${buttons}<button class="secondary" data-dismiss>${n.type==='event'||n.type==='status'?'あとで':'とじる'}</button><small class="notice">${n.notification?`未確認のお知らせ ${myNotifications().length}件 / 確認後は再表示しません`:''}</small>`,n.title);}

async function completeEvent(id){const e=recoveryEvents.find(e=>e.id===id);if(completing||!e||state.done.includes(id)||Date.parse(e.availableAt)>now())return;completing=true;let applied=false,beforePlayers=null;const pending=activeNotice;activeNotice=null;const success=await update(s=>{let n=applyEvent(s,id,now());if(n===s)return s;beforePlayers=structuredClone(s.players);applied=true;if(pending?.notification)n.ack.push(`${myRole()}:${pending.id}`);return n;});completing=false;if(success&&applied&&!repository.lastChange)toast('この端末で達成済み、または未解放のイベントです。');if(success&&applied&&repository.lastChange){const effect=eventEffect(e);activeNotice={type:'level',title:'LEVEL UP!',text:'ふたりのステータスが大きく成長した！',growth:effect.max,before:beforePlayers,after:structuredClone(state.players)};refreshOverlay();}}

let timeSignature='';

let growthAnimation=0;
function drawGrowth(n){
 const reducedMotion=reduced();
 const cards=['groom','bride'].map(role=>`<article class="growth-player"><header>${sprite(role)}<h3>${role==='groom'?'新郎':'新婦'}</h3></header>${Object.entries(n.growth).map(([key,gain])=>{
  const before=n.before[role][key][1],after=n.after[role][key][1];
  return `<div class="growth-stat"><span>最大${labels[key]}</span><strong>＋${gain}！</strong><div><span>${before} → </span><b data-growth-count data-from="${before}" data-to="${after}">${reducedMotion?after:before}</b></div><div class="growth-track"><i data-growth-bar data-from="${before/after*100}" style="width:${reducedMotion?100:before/after*100}%"></i></div></div>`;
 }).join('')}</article>`).join('');
 showModal(`<div class="popup-art">✦</div><span class="eyebrow">EVENT CLEAR!</span><h2 class="level-title">LEVEL UP!</h2><p>ふたりの冒険の器が大きくなった！</p><div class="growth-cards">${cards}</div><button class="primary" data-dismiss>成長を受け取った！</button>`,'レベルアップ');
 const token=++growthAnimation;if(reducedMotion)return;
 const started=performance.now();
 function frame(t){if(token!==growthAnimation||activeNotice!==n)return;const p=Math.min(1,Math.max(0,(t-started)/1400));const eased=1-(1-p)**3;
  for(const el of document.querySelectorAll('[data-growth-count]'))el.textContent=Math.round(+el.dataset.from+(+el.dataset.to-+el.dataset.from)*eased);
  for(const el of document.querySelectorAll('[data-growth-bar]'))el.style.width=(+el.dataset.from+(100-+el.dataset.from)*eased)+'%';
  if(p<1)requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}
