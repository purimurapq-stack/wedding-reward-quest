name: Verify local travel RPG
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Local save and static Pages checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test local game and saved-data migration
        run: npm test
      - name: Build static app with original PNGs
        run: npm run build
      - name: Upload preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-rpg-preview
          path: reward-quest-preview.html
          if-no-files-found: error
